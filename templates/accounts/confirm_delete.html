{% extends 'base.html' %}
{% block title %}{{ title }} — LabTrack Pro{% endblock %}
{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="card border-0 shadow-sm" style="border-radius:12px;">
      <div class="card-body p-4 text-center">
        <i class="bi bi-exclamation-triangle text-danger fs-1"></i>
        <h5 class="mt-3">Are you sure?</h5>
        <p class="text-muted">You are about to delete <strong>{{ object }}</strong>. This cannot be undone.</p>
        <form method="post" class="d-flex gap-2 justify-content-center mt-4">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
          <a href="{% url 'user_list' %}" class="btn btn-outline-secondary px-4">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
